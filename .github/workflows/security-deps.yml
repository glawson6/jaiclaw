name: Dependency CVE Scan

# Runs OWASP dependency-check across the reactor. Triggered:
#   - weekly on a schedule (Mondays 09:00 UTC), so the NVD-feed updates land
#     even if no commits touch dependencies
#   - on-demand via workflow_dispatch
#   - on PRs that touch any pom.xml
#
# The suppression file at .security/dependency-check-suppressions.xml
# contains the audit's 45 known false positives — keep it tight; document
# every suppression with a "why" comment.
#
# Fails the build on CVSS >= 7.0 without a matching suppression. Audit
# reference: docs/CODEBASE-ANALYSIS-2026-06-10.md §2.6, §4.3.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
  pull_request:
    branches: [main]
    paths:
      - '**/pom.xml'

jobs:
  dep-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile reactor
        run: ./mvnw install -DskipTests -B
        env:
          MAVEN_OPTS: '-Xmx2g'

      # Cache the dependency-check data directory (NVD CVE feed + CPE caches)
      # between runs. NVD downloads are slow and rate-limited; a cache hit
      # cuts the job runtime substantially and avoids 403s from NVD when
      # many concurrent jobs share a single API key.
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.dc-data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dc-data-${{ runner.os }}-

      - name: Run OWASP dependency-check
        run: |
          # -Dnvd.api.key is REQUIRED here, not just the NVD_API_KEY env var.
          # The POM reads the Maven property ${nvd.api.key} (pom.xml), and
          # nothing bridges an env var to it. Without this flag the plugin
          # aborts on the first artifact with
          #   NvdApiException: Invalid API Key, length of 0 too short
          # and every downstream step still reports success. That defect
          # silently produced ZERO CVE data on every scheduled run up to
          # 2026-09-08 — see security-report-2026-09-08.md.
          ./mvnw -B \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7.0 \
            -DsuppressionFiles=.security/dependency-check-suppressions.xml \
            -Dformat=ALL \
            -Dnvd.api.key="$NVD_API_KEY" \
            -DossIndex.user="$OSS_USERNAME" \
            -DossIndex.token="$OSS_API_TOKEN" \
            -DdataDirectory="${{ github.workspace }}/.dc-data"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # OSS Index credentials. Sonatype enforces API tokens since
          # Sep 2025 and is migrating to Guide tokens through end of 2026
          # — if either secret is missing the analyzer auto-disables, and
          # the pom's warn-only-on-remote-errors setting keeps the build
          # green through token churn. NVD is the authoritative source
          # either way.
          OSS_USERNAME: ${{ secrets.OSS_USERNAME }}
          OSS_API_TOKEN: ${{ secrets.OSS_API_TOKEN }}

      # A scan that analyzes zero dependencies is indistinguishable from a
      # clean scan in the plugin's exit code. That is exactly how this
      # workflow reported "green" while producing no CVE data at all: the
      # only report ever committed (jaiclaw-bom, 2026-08-24) contained
      # "dependencies": 0. Assert the aggregate count is non-trivial so a
      # broken scan fails loudly instead of passing silently.
      - name: Assert the scan actually analyzed dependencies
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, sys

          MIN_DEPS = 500  # the 2026-09-08 full-reactor baseline was 12,182

          reports = [f for f in glob.glob('**/target/dependency-check-report.json',
                                          recursive=True)
                     if 'node_modules' not in f]
          if not reports:
              sys.exit('FAIL: no dependency-check JSON reports were produced.')

          total = 0
          for path in reports:
              try:
                  with open(path) as handle:
                      total += len(json.load(handle).get('dependencies', []))
              except (OSError, ValueError) as exc:
                  sys.exit(f'FAIL: unreadable report {path}: {exc}')

          print(f'{len(reports)} report(s), {total} dependency entries analyzed.')
          if total < MIN_DEPS:
              sys.exit(
                  f'FAIL: only {total} dependency entries analyzed '
                  f'(expected >= {MIN_DEPS}). The scan aborted early — most '
                  'likely a missing or rejected NVD API key. Treat this run '
                  'as PRODUCING NO CVE DATA, not as a clean result.'
              )
          PY

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: '**/target/dependency-check-report.*'
          retention-days: 30
          if-no-files-found: warn
